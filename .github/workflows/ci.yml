name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # Der Testbuild darf ein unvollständiges Impressum haben. Der Deploy-Workflow erlaubt das nicht.
      - run: pnpm --filter @toolkit/web build
        env:
          ALLOW_INCOMPLETE_LEGAL: '1'
